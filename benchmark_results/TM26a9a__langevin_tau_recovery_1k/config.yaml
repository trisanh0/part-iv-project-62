# TEMPO Overnight Langevin Bifurcation Parameter Recovery & Physical Interpretability (TM26a9a)
# Document ID: TM26a9a
# Direct fulfillment of Meeting 9 Action Item 48: N=1,000 empirical Langevin samples across tau in [1/0.3, 4]

dataset_paths:
  - "data/03_processed/drift-bifurcation-reg-1k"

task_type: "regression"

extractors:
  - name: "numba_efficient"
    fft_coefficients: 25
  - name: "polars_statistics"
  - name: "numpy_statistical"
  - name: "tsfresh_minimal"

selectors:
  - null                              # Raw baseline unselected features
  - name: "variance_threshold"       # Zero-variance filter
    threshold: 0.0
  - name: "select_k_best"             # F-regression selection (k=15)
    k: 15
  - name: "l1"                        # Lasso / L1 regularised regression
    alpha: 0.05
  - name: "tree_importance"           # ExtraTrees regressor importance
    model_type: "extra_trees"
    n_estimators: 50
  - name: "subsampled"                # Two-Stage Subsampled FDR Selection (10% sample)
    sample_ratio: 0.10
    base_selector: "tsfresh"

models:
  - "random_forest"
  - "ridge"

n_splits: 5
seeds:
  - 42
  - 101
  - 777

cache_backend: "parquet"
cache_dir: "data/03_processed/feature_store"
output_dir: "benchmark_results/TM26a9a__langevin_tau_recovery_1k"

enable_telemetry: true
telemetry_interval: 0.05
enable_ttests: true
enable_plots: true
enable_logging: true
log_file: "langevin_tau_recovery_1k.log"
resume: true
