# TM26a15c: Continuous Appliances Energy Regression Bakeoff
# Document ID: TM26a15c__energy_regression

dataset_paths:
  - "data/03_processed/appliances-energy"

task_type: "regression"

extractors:
  - name: "numba_efficient"
    fft_coefficients: 25
  - name: "tsfresh_efficient"
    fft_coefficients: 25
  - name: "tsfel"
  - name: "polars_statistics"

selectors:
  - null
  - name: "select_k_best_anova"
    k: 25
  - name: "mutual_info"
    k: 25
  - "fdr"
  - name: "subsampled_fdr"
    sample_ratio: 0.10
    base_selector: "tsfresh"

models:
  - "random_forest"
  - "ridge"

n_splits: 5
seeds:
  - 42

cache_backend: "parquet"
cache_dir: "data/03_processed/feature_store"
output_dir: "benchmark_results/TM26a15__overnight_fleet_bakeoff/energy_regression"

enable_telemetry: true
telemetry_interval: 0.05
enable_ttests: true
enable_plots: true
enable_logging: true
log_file: "energy_regression.log"
resume: true
