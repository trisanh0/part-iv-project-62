# TEMPO Overnight Empirical Classification Bakeoff (Part B: Bifurcation Threshold & Multi-Sensor Drift)
# Document ID: TM26a7b
# Evaluates Extractor and Selector Efficiency on Critical Bifurcation Transitions and Chemical Sensor Drift

dataset_paths:
  - "data/03_processed/drift-bifurcation-cls"
  - "data/03_processed/gas-sensor-drift-sub"

task_type: "classification"

extractors:
  - name: "numba_efficient"
    fft_coefficients: 25
  - name: "polars_statistics"
  - name: "numpy_statistical"
  - name: "tsfresh_minimal"

selectors:
  - null                              # Raw baseline unselected features
  - name: "variance_threshold"       # Zero-variance filter
    threshold: 0.0
  - name: "select_k_best"             # ANOVA F-test (k=25)
    k: 25
  - name: "l1"                        # L1 / Lasso penalized linear selector
    C: 1.0
  - name: "tree_importance"           # ExtraTrees Gini importance
    model_type: "extra_trees"
    n_estimators: 50
  - name: "subsampled"                # Two-Stage Subsampled FDR Selection (10% sample)
    sample_ratio: 0.10
    base_selector: "tsfresh"

models:
  - "random_forest"
  - "logistic_regression"

n_splits: 5
seeds:
  - 42
  - 101

cache_backend: "parquet"
cache_dir: "data/03_processed/feature_store"
output_dir: "benchmark_results/TM26a7b__overnight_classification"

enable_telemetry: true
telemetry_interval: 0.05
enable_ttests: true
enable_plots: true
enable_logging: true
log_file: "overnight_classification.log"
resume: true
