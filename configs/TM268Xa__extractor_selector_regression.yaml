# TEMPO Feature Extractor and Selector Comparison Matrix (Extrinsic Regression)
# Document ID: TM268Xa
# Evaluates 5 Extractors x 6 Selectors across 2 Regression Datasets with 10-Fold CV.

dataset_paths:
  - "data/03_processed/appliances-energy"
  - "data/03_processed/beijing-pm25"

task_type: "regression"

extractors:
  - name: "numba_efficient"
    fft_coefficients: 25
  - name: "polars_statistics"
  - name: "numpy_statistical"
  - name: "tsfel"
  - name: "tsfresh_minimal"

selectors:
  - null                              # Raw baseline unselected features
  - name: "select_k_best_anova"       # F-regression (k=25)
    k: 25
  - name: "mutual_info"               # Non-linear Mutual Information (k=25)
    k: 25
  - "fdr"                             # Full TSFresh FDR hypothesis test (q=0.05)
  - name: "subsampled_fdr"            # Two-Stage Subsampled FDR Selection (10% sample)
    sample_ratio: 0.10
    base_selector: "tsfresh"

models:
  - "random_forest"
  - "ridge"

n_splits: 5
seeds:
  - 42
  - 123

cache_backend: "parquet"
cache_dir: "data/03_processed/feature_store"
output_dir: "benchmark_results/TM268Xa__extractor_selector_matrix/regression"

enable_telemetry: true
telemetry_interval: 0.05
enable_ttests: true
enable_plots: true
enable_logging: true
log_file: "regression_matrix.log"
